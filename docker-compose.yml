services:
  bus-db:
    image: postgres:16-alpine
    container_name: traveleasy-bus-db
    environment:
      POSTGRES_DB: bus_db
      POSTGRES_USER: traveleasy_user
      POSTGRES_PASSWORD: traveleasy_pass
    ports:
      - "5432:5432"
    volumes:
      - bus_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traveleasy_user -d bus_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - traveleasy-bus-network

  bus-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: traveleasy-bus-service
    depends_on:
      bus-db:
        condition: service_healthy
    environment:
      SERVER_PORT: 8081
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://bus-db:5432/bus_db
      DB_USERNAME: traveleasy_user
      DB_PASSWORD: traveleasy_pass
      JWT_SECRET: TravelEasyBusServiceSuperSecretKey2026MustBeAtLeast256BitsLongForHMACSHA256!
      JWT_ISSUER: traveleasy-auth-service
      CORS_ALLOWED_ORIGINS: "http://localhost:4200,http://localhost:80,http://localhost"
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-TravelEasy <onboarding@resend.dev>}
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s
    networks:
      - traveleasy-bus-network

  bus-ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: traveleasy-bus-ui
    depends_on:
      bus-service:
        condition: service_healthy
    ports:
      - "4200:80"
      - "8080:80"
    networks:
      - traveleasy-bus-network

volumes:
  bus_db_data:
    driver: local

networks:
  traveleasy-bus-network:
    driver: bridge
