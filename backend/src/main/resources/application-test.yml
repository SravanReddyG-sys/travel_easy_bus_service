spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:bus_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    show-sql: false

  flyway:
    enabled: false

app:
  security:
    jwt:
      secret: TravelEasyTestSecretKeyThatIsAtLeast256BitsLongForHMACSHA256TestingOnly!
      expiration-ms: 3600000
      issuer: traveleasy-test-auth
  integration:
    booking:
      mock-mode: true
