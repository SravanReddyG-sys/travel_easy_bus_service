apiVersion: apps/v1
kind: Deployment
metadata:
  name: bus-ui
  namespace: traveleasy
  labels:
    app: bus-ui
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bus-ui
  template:
    metadata:
      labels:
        app: bus-ui
        tier: frontend
    spec:
      containers:
        - name: bus-ui
          image: traveleasy-bus-ui:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: bus-ui
  namespace: traveleasy
  labels:
    app: bus-ui
spec:
  type: LoadBalancer
  ports:
    - port: 4200
      targetPort: 80
      name: http
  selector:
    app: bus-ui
