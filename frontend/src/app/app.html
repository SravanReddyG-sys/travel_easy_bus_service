<div class="app-layout">
  <!-- Navigation Bar -->
  <nav class="main-navbar">
    <div class="nav-container">
      <div class="brand-group">
        <a routerLink="/traveller/search" class="brand-logo">
          <span class="logo-icon">&#128652;</span>
          <span class="brand-text">Travel<strong>Easy</strong> <span class="badge-bus">BUS</span></span>
        </a>
      </div>

      <div class="nav-links">
        <a routerLink="/traveller/search" routerLinkActive="active" class="nav-item">
          Search Buses
        </a>
        <a routerLink="/operator/dashboard" routerLinkActive="active" class="nav-item" *ngIf="authService.isOperator()">
          Dashboard
        </a>
        <a routerLink="/operator/buses" routerLinkActive="active" class="nav-item" *ngIf="authService.isOperator()">
          Fleet
        </a>
        <a routerLink="/operator/schedules" routerLinkActive="active" class="nav-item" *ngIf="authService.isOperator()">
          Schedules
        </a>
      </div>

      <!-- Role Switcher Pill -->
      <div class="role-switcher">
        <button
          type="button"
          class="role-btn"
          [class.active]="authService.currentUser.role === 'TRAVELLER'"
          (click)="switchRole('TRAVELLER')">
          Traveller Mode
        </button>
        <button
          type="button"
          class="role-btn"
          [class.active]="authService.currentUser.role === 'OPERATOR'"
          (click)="switchRole('OPERATOR')">
          Operator Mode
        </button>
      </div>
    </div>
  </nav>

  <!-- Main View Outlet -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

  <!-- Global Footer -->
  <footer class="main-footer">
    <div class="footer-container">
      <p>&copy; 2026 TravelEasy Bus Microservice &bull; Pessimistic Concurrency Seat Inventory & Outbox Engine</p>
      <p class="sub">Central Booking Service API Contract v1.0 &bull; Port: 8082 / UI: 4200</p>
    </div>
  </footer>
</div>
